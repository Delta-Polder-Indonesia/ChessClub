# FILE INI = salinan persis .github/workflows/quality.yml (isi yang aktif di `main`).
# Keberadaan berkas ini hanya cadangan untuk lingkungan yang token-nya tidak
# punya izin `workflows`: salin seluruh isi di bawah ke
# .github/workflows/quality.yml (bukan di-rename — berkas ini memang mirror).
# Ubah salah satu → ubah keduanya, kalau tidak dokumennya jadi bohong.
# Catatan: Git LFS sudah tidak dipakai (PDF e-book = blob Git biasa, lihat
# scripts/keluar-dari-lfs.sh), karena itu checkout sengaja TANPA `lfs: true`.

name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test and browser smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        # The release gate imports build/test-only packages such as Tailwind,
        # Vite, and jsdom; never let a production NODE_ENV omit them.
        run: npm ci --include=dev

      - name: Run the v1 release gate
        run: npm run uji:rilis:v1

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run public browser smoke tests
        run: npm run uji:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7