<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!--
      CSP dasar untuk host statis yang tidak bisa mengirim header (GitHub
      Pages). Di Vercel kebijakan yang sama — ditambah frame-ancestors,
      X-Content-Type-Options, Referrer-Policy, COOP dan Permissions-Policy —
      dikirim sebagai HTTP header lewat vercel.json, karena beberapa direktif
      (frame-ancestors, report-uri) diabaikan browser bila hanya ada di
      <meta>; Lighthouse mencatatnya sebagai galat konsol.
      'wasm-unsafe-eval' diperlukan agar Stockfish (WebAssembly) di halaman
      Papan Interaktif tetap boleh dijalankan.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'wasm-unsafe-eval' https://va.vercel-scripts.com;
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: https:;
        font-src 'self' data:;
        connect-src 'self' https://api.chess.com https://lichess.org https://tablebase.lichess.ovh https://va.vercel-scripts.com https://*.wikipedia.org https://*.wikibooks.org https://translate.googleapis.com;
        worker-src 'self' blob:;
        frame-src 'self';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
      "
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Verifikasi kepemilikan situs di Google Search Console (metode
      "HTML tag"). Google membaca tag ini saat tombol Verify ditekan dan
      saat memverifikasi ulang berkala. Tag ini tidak memengaruhi tampilan
      maupun peringkat. Bila kelak ada property lain (mis. domain kustom)
      yang diverifikasi dengan token berbeda, TAMBAH satu baris <meta>
      lagi — jangan menimpa token yang sudah ada.
    -->
    <meta
      name="google-site-verification"
      content="bWdpNEopAePye9xQpJOl2H5MoAxcrjClcESsm44ULP0"
    />
    <title>Blunder Skuad | Komunitas Catur Indonesia</title>
    <meta
      name="description"
      content="Blunder Skuad — Komunitas Catur Indonesia: wadah bermain, belajar, dan bertumbuh bagi pecatur. Ikuti jadwal turnamen, peringkat anggota, kelas pelatihan, dan kabar komunitas terbaru."
    />
    <!--
      Kata kunci (SEO). Catatan: Google mengabaikan tag ini untuk
      pemeringkatan — yang tampil di hasil pencarian Google adalah <title>
      dan meta description di atas. Tag ini tetap berguna untuk mesin
      pencarian lain, agregator, dan dokumenasi isi situs.
    -->
    <meta
      name="keywords"
      content="blunder skuad, Blunder Skuad, catur, komunitas catur, komunitas catur Indonesia, klub catur, turnamen catur, jadwal turnamen catur, belajar catur, sekolah catur, teka-teki catur, skakmat, pembukaan catur, e-book catur, papan catur interaktif, Stockfish, komunitas chess, chess Indonesia, Indonesian chess community"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="%%SITE_URL%%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Komunitas Catur Indonesia" />
    <meta property="og:title" content="Blunder Skuad | Komunitas Catur Indonesia" />
    <meta
      property="og:description"
      content="Blunder Skuad — Komunitas Catur Indonesia: wadah bermain, belajar, dan bertumbuh bagi pecatur. Ikuti jadwal turnamen, peringkat anggota, kelas pelatihan, dan kabar komunitas terbaru."
    />
    <meta property="og:url" content="%%SITE_URL%%" />
    <meta property="og:image" content="%%SITE_URL%%images/landing-hero.webp" />
    <meta property="og:image:width" content="828" />
    <meta property="og:image:height" content="462" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Blunder Skuad | Komunitas Catur Indonesia" />
    <meta
      name="twitter:description"
      content="Blunder Skuad — Komunitas Catur Indonesia: wadah bermain, belajar, dan bertumbuh bagi pecatur."
    />
    <meta name="twitter:image" content="%%SITE_URL%%images/landing-hero.webp" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Komunitas Catur Indonesia",
        "alternateName": "Blunder Skuad",
        "url": "%%SITE_URL%%",
        "logo": "%%SITE_URL%%images/logo-mark-dark.webp",
        "email": "info@komunitascatur.or.id",
        "description": "Blunder Skuad — komunitas catur Indonesia: wadah bermain, belajar, dan bertumbuh bagi pecatur.",
        "sameAs": [
          "https://www.chess.com/club/blunder-skuad"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Komunitas Catur Indonesia",
        "url": "%%SITE_URL%%",
        "inLanguage": ["id", "en"],
        "description": "Wadah bermain, belajar, dan bertumbuh bagi pecatur: jadwal turnamen, peringkat anggota, kelas pelatihan, teka-teki, buku pembukaan, dan e-book catur."
      }
    </script>
    <link
      rel="preload"
      as="image"
      href="/images/tonggak-2015.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <style>
      /* Gambar boot = slide PERTAMA hero Landing (tonggak-2015) dengan
         tinggi yang sama (650px). Dengan begitu saat React menggantinya
         dengan hero asli, pengguna tidak melihat gambar berganti-ganti.
         Dibuang oleh komponen BersihkanBootHero begitu konten halaman
         pertama benar-benar ter-render. */
      #boot-hero {
        position: absolute;
        inset: 0 0 auto 0;
        height: 650px;
        background: #021624;
        overflow: hidden;
        z-index: 0;
        pointer-events: none;
      }
      #boot-hero img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #root {
        position: relative;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-hero" aria-hidden="true">
      <img
        src="/images/tonggak-2015.webp"
        alt=""
        width="828"
        height="462"
        fetchpriority="high"
        decoding="async"
      />
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
