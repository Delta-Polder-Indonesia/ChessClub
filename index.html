<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!--
      CSP dasar untuk host statis yang tidak bisa mengirim header (GitHub
      Pages). Di Vercel kebijakan yang sama — ditambah frame-ancestors,
      X-Content-Type-Options, Referrer-Policy, COOP dan Permissions-Policy —
      dikirim sebagai HTTP header lewat vercel.json, karena beberapa direktif
      (frame-ancestors, report-uri) diabaikan browser bila hanya ada di
      <meta>; Lighthouse mencatatnya sebagai galat konsol.
      'wasm-unsafe-eval' diperlukan agar Stockfish (WebAssembly) di halaman
      Papan Interaktif tetap boleh dijalankan.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'wasm-unsafe-eval';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: https:;
        font-src 'self' data:;
        connect-src 'self' https://api.chess.com https://tablebase.lichess.ovh https://va.vercel-scripts.com https://*.wikipedia.org https://*.wikibooks.org https://translate.googleapis.com;
        worker-src 'self' blob:;
        frame-src 'self';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
      "
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beranda | Komunitas Catur Indonesia</title>
    <meta
      name="description"
      content="Komunitas Catur Indonesia — wadah bermain, belajar, dan bertumbuh bagi pecatur. Ikuti jadwal turnamen, peringkat anggota, kelas pelatihan, dan kabar komunitas terbaru."
    />
    <link rel="canonical" href="%%SITE_URL%%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Komunitas Catur Indonesia" />
    <meta property="og:title" content="Beranda | Komunitas Catur Indonesia" />
    <meta
      property="og:description"
      content="Komunitas Catur Indonesia — wadah bermain, belajar, dan bertumbuh bagi pecatur. Ikuti jadwal turnamen, peringkat anggota, kelas pelatihan, dan kabar komunitas terbaru."
    />
    <meta property="og:url" content="%%SITE_URL%%" />
    <meta property="og:image" content="https://delta-polder-indonesia.github.io/ChessClub/images/landing-hero-828.webp" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Beranda | Komunitas Catur Indonesia" />
    <meta
      name="twitter:description"
      content="Komunitas Catur Indonesia — wadah bermain, belajar, dan bertumbuh bagi pecatur."
    />
    <meta name="twitter:image" content="https://delta-polder-indonesia.github.io/ChessClub/images/landing-hero-828.webp" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Komunitas Catur Indonesia",
        "url": "https://delta-polder-indonesia.github.io/ChessClub/",
        "logo": "https://delta-polder-indonesia.github.io/ChessClub/images/logo-mark-dark.webp",
        "email": "info@komunitascatur.or.id",
        "description": "Komunitas catur Indonesia — wadah bermain, belajar, dan bertumbuh bagi pecatur.",
        "sameAs": [
          "https://www.chess.com/club/blunder-skuad"
        ]
      }
    </script>
    <link
      rel="preload"
      as="image"
      href="/images/tonggak-2015-828.webp"
      type="image/webp"
      fetchpriority="high"
      imagesrcset="/images/tonggak-2015-828.webp 828w, /images/tonggak-2015.webp 1280w"
      imagesizes="100vw"
    />
    <style>
      /* Gambar boot = slide PERTAMA hero Landing (tonggak-2015) dengan
         tinggi yang sama (650px). Dengan begitu saat React menggantinya
         dengan hero asli, pengguna tidak melihat gambar berganti-ganti.
         Dibuang oleh komponen BersihkanBootHero begitu konten halaman
         pertama benar-benar ter-render. */
      #boot-hero {
        position: absolute;
        inset: 0 0 auto 0;
        height: 650px;
        background: #021624;
        overflow: hidden;
        z-index: 0;
        pointer-events: none;
      }
      #boot-hero img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #root {
        position: relative;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-hero" aria-hidden="true">
      <img
        src="/images/tonggak-2015-828.webp"
        srcset="/images/tonggak-2015-828.webp 828w, /images/tonggak-2015.webp 1280w"
        sizes="100vw"
        alt=""
        width="828"
        height="462"
        fetchpriority="high"
        decoding="async"
      />
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
