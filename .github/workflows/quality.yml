name: Quality checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Tiga pecahan gerbang rilis berjalan paralel. Job test dipertahankan sebagai
# required-check aggregator untuk proteksi branch main; Playwright tetap
# berjalan independen sejak awal.
jobs:
  v1-build-server:
    name: V1 build and server tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Lint
        run: npm run lint
      - name: Run Wawasan regression tests
        run: npm run uji:wawasan-profil && node scripts/uji-analisa-ui.mjs
      - name: Run v1 build and server partition
        run: |
          set -o pipefail
          if ! npm run uji:v1:build-server 2>&1 | tee /tmp/uji-v1-build-server.log; then
            SKRIP_TERAKHIR=$(grep -E "^> komunitas-catur@" /tmp/uji-v1-build-server.log | tail -n 4 | tr '\n' ' ' | sed 's/::/ /g')
            RINGKASAN=$(grep -E "✗|❌|GAGAL|FAIL|Error:|AssertionError|ELIFECYCLE|npm error" /tmp/uji-v1-build-server.log | tail -n 25 | tr '\n' ' ' | sed 's/::/ /g')
            EKOR=$(tail -n 30 /tmp/uji-v1-build-server.log | tr '\n' ' ' | sed 's/::/ /g')
            echo "::error title=uji:v1:build-server gagal (${SKRIP_TERAKHIR})::${RINGKASAN}"
            echo "::error title=uji:v1:build-server ekor log::${EKOR}"
            exit 1
          fi

  v1-ui-engine:
    name: V1 UI and engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Run v1 UI and engine partition
        run: |
          set -o pipefail
          if ! npm run uji:v1:ui-engine 2>&1 | tee /tmp/uji-v1-ui-engine.log; then
            SKRIP_TERAKHIR=$(grep -E "^> komunitas-catur@" /tmp/uji-v1-ui-engine.log | tail -n 4 | tr '\n' ' ' | sed 's/::/ /g')
            RINGKASAN=$(grep -E "✗|❌|GAGAL|FAIL|Error:|AssertionError|ELIFECYCLE|npm error" /tmp/uji-v1-ui-engine.log | tail -n 25 | tr '\n' ' ' | sed 's/::/ /g')
            EKOR=$(tail -n 30 /tmp/uji-v1-ui-engine.log | tr '\n' ' ' | sed 's/::/ /g')
            echo "::error title=uji:v1:ui-engine gagal (${SKRIP_TERAKHIR})::${RINGKASAN}"
            echo "::error title=uji:v1:ui-engine ekor log::${EKOR}"
            exit 1
          fi

  v1-fitur-puzzle:
    name: V1 puzzle feature tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Run v1 puzzle feature partition
        run: |
          set -o pipefail
          if ! npm run uji:v1:fitur-puzzle 2>&1 | tee /tmp/uji-v1-fitur-puzzle.log; then
            SKRIP_TERAKHIR=$(grep -E "^> komunitas-catur@" /tmp/uji-v1-fitur-puzzle.log | tail -n 4 | tr '\n' ' ' | sed 's/::/ /g')
            RINGKASAN=$(grep -E "✗|❌|GAGAL|FAIL|Error:|AssertionError|ELIFECYCLE|npm error" /tmp/uji-v1-fitur-puzzle.log | tail -n 25 | tr '\n' ' ' | sed 's/::/ /g')
            EKOR=$(tail -n 30 /tmp/uji-v1-fitur-puzzle.log | tr '\n' ' ' | sed 's/::/ /g')
            echo "::error title=uji:v1:fitur-puzzle gagal (${SKRIP_TERAKHIR})::${RINGKASAN}"
            echo "::error title=uji:v1:fitur-puzzle ekor log::${EKOR}"
            exit 1
          fi

  test:
    name: Test and browser smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [v1-build-server, v1-ui-engine, v1-fitur-puzzle]
    if: always()
    steps:
      - name: Verify all v1 partitions succeeded
        env:
          BUILD_SERVER: ${{ needs.v1-build-server.result }}
          UI_ENGINE: ${{ needs.v1-ui-engine.result }}
          FITUR_PUZZLE: ${{ needs.v1-fitur-puzzle.result }}
        run: |
          if [[ "$BUILD_SERVER" != "success" || "$UI_ENGINE" != "success" || "$FITUR_PUZZLE" != "success" ]]; then
            echo "::error title=Gerbang rilis v1 gagal::build-server=$BUILD_SERVER, ui-engine=$UI_ENGINE, fitur-puzzle=$FITUR_PUZZLE"
            exit 1
          fi
          echo "Ketiga pecahan gerbang rilis v1 berhasil."

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Restore Chromium download cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Chromium for Playwright
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Run browser tests
        run: |
          set -o pipefail
          if ! npm run uji:e2e 2>&1 | tee /tmp/e2e.log; then
            EKOR=$(tail -n 35 /tmp/e2e.log | tr '\n' ' ' | sed 's/::/ /g')
            echo "::error title=uji:e2e gagal::${EKOR}"
            exit 1
          fi
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
