          V1_HAND_BRAIN: ${{ needs.v1-hand-brain.result }}
          V1_TURING_TEST: ${{ needs.v1-turing-test.result }}
        run: |
          HASIL=" V1_BUILD_SERVER=$V1_BUILD_SERVER V1_UI_ENGINE=$V1_UI_ENGINE V1_TEKA_TEKI_CATUR=$V1_TEKA_TEKI_CATUR V1_RUSH_TEKA_TEKI=$V1_RUSH_TEKA_TEKI V1_TEKA_TEKI_HARIAN=$V1_TEKA_TEKI_HARIAN V1_KUIS_CATUR=$V1_KUIS_CATUR V1_REPORT_ANALISA=$V1_REPORT_ANALISA V1_PEMBUKAAN=$V1_PEMBUKAAN V1_LAWAN_BOT=$V1_LAWAN_BOT V1_EBOOK_PANDUAN=$V1_EBOOK_PANDUAN V1_LATIHAN_REPERTOAR=$V1_LATIHAN_REPERTOAR V1_HAND_BRAIN=$V1_HAND_BRAIN V1_TURING_TEST=$V1_TURING_TEST"
          if [[ "$V1_BUILD_SERVER" == "success" && "$V1_UI_ENGINE" == "success" && "$V1_TEKA_TEKI_CATUR" == "success" && "$V1_RUSH_TEKA_TEKI" == "success" && "$V1_TEKA_TEKI_HARIAN" == "success" && "$V1_KUIS_CATUR" == "success" && "$V1_REPORT_ANALISA" == "success" && "$V1_PEMBUKAAN" == "success" && "$V1_LAWAN_BOT" == "success" && "$V1_EBOOK_PANDUAN" == "success" && "$V1_LATIHAN_REPERTOAR" == "success" && "$V1_HAND_BRAIN" == "success" && "$V1_TURING_TEST" == "success" ]]; then
            echo "Seluruh job validasi program berhasil."
          else
            echo "::error title=Gerbang CI gagal::$HASIL"
            exit 1
          fi

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Restore Chromium download cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Chromium for Playwright
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Run browser tests
        run: |
          set -o pipefail
          if ! npm run uji:e2e 2>&1 | tee /tmp/e2e.log; then
            EKOR=$(tail -n 35 /tmp/e2e.log | tr '\n' ' ' | sed 's/::/ /g')
            echo "::error title=uji:e2e gagal::${EKOR}"
            exit 1
          fi
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
