name: Quality checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Tiga pecahan gerbang rilis berjalan paralel. Job test dipertahankan sebagai
# required-check aggregator untuk proteksi branch main; Playwright tetap
# berjalan independen sejak awal.
jobs:
  v1-build-server:
    name: V1 build and server tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Run lint, Wawasan, and build-server partition
        run: |
          set -o pipefail
          if ! { npm run lint && npm run uji:wawasan-profil && node scripts/uji-analisa-ui.mjs && npm run uji:v1:build-server; } 2>&1 | tee /tmp/uji-v1-build-server.log; then
            SKRIP_TERAKHIR=$(grep -E "^> komunitas-catur@|^Error:|^AssertionError|GAGAL|FAIL|✗" /tmp/uji-v1-build-server.log | tail -n 8 | tr '\n' ' ' | sed 's/::/ /g')
            RINGKASAN=$(grep -E "✗|❌|GAGAL|FAIL|Error:|AssertionError|ELIFECYCLE|npm error" /tmp/uji-v1-build-server.log | tail -n 25 | tr '\n' ' ' | sed 's/::/ /g')
            EKOR=$(tail -n 30 /tmp/uji-v1-build-server.log | tr '\n' ' ' | sed 's/::/ /g')
            echo "::error title=Job v1-build-server gagal (${SKRIP_TERAKHIR})::${RINGKASAN}"
            echo "::error title=Job v1-build-server ekor log::${EKOR}"
            exit 1
          fi

  v1-ui-engine:
    name: V1 UI and engine tests
