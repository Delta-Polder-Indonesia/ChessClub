name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test and browser smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        # The release gate imports build/test-only packages such as Tailwind,
        # Vite, and jsdom; never let a production NODE_ENV omit them.
        run: npm ci --include=dev

      - name: Run the v1 release gate
        run: npm run uji:rilis:v1

      - name: Install Chromium for Playwright
        # `--with-deps` shells out to `apt-get update`, which stalls on
        # azure.archive.ubuntu.com (actions/runner-images#11347) and burns the
        # job's 15-minute budget. ubuntu-latest already ships Chromium's system
        # libraries, so only the browser download is needed. The step timeout
        # keeps a CDN hang from eating the rest of the job.
        timeout-minutes: 5
        run: npx playwright install chromium

      - name: Run public browser smoke tests
        run: npm run uji:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7