name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  # Aktifkan Dependency Graph pada Settings > Code security and analysis,
  # lalu set repository variable DEPENDENCY_GRAPH_ENABLED=true.
  # Audit npm penuh tetap menjadi gerbang wajib selama fitur ini belum aktif.
  dependency-review:
    if: ${{ vars.DEPENDENCY_GRAPH_ENABLED == 'true' }}
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
