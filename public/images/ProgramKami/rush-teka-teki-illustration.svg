    <text x="0" y="54" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#182a45">Berpikir cepat,</text>
    <text x="0" y="100" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#256bd6">pilih langkah tepat.</text>
    <text x="0" y="145" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#4b607d">Selesaikan teka-teki catur</text>
    <text x="0" y="175" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#4b607d">sebelum waktu berakhir.</text>
