<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>Komunitas Catur Indonesia</title>
    <script>
      (function () {
        // GitHub Pages menyajikan 404.html untuk alamat rute dalam situs
        // (mis. /ChessClub/tentang-kami). Simpan alamat asli, lalu arahkan
        // ke index.html. Aplikasi akan memulihkan rute dari sessionStorage.
        var jalur = window.location.pathname;
        var tambahan = window.location.search + window.location.hash;
        var kunci = "kci-rute-tersimpan";
        try {
          sessionStorage.setItem(kunci, jalur + tambahan);
        } catch (e) {
          /* mode privat — abaikan */
        }
        // 404.html hanya disajikan untuk alamat di bawah base situs.
        // Base adalah segmen pertama (mis. /ChessClub/).
        var segmen = jalur.split("/").filter(Boolean);
        var base = segmen.length ? "/" + segmen[0] + "/" : "/";
        window.location.replace(base);
      })();
    </script>
  </head>
  <body></body>
</html>
