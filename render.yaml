# Blueprint Render.com GRATIS untuk backend KCI (Komunitas Catur Indonesia).
#
# File ini sengaja memakai plan `free` supaya Blueprint dapat dipakai untuk
# uji coba tanpa Persistent Disk dan tanpa paket Starter. Render membaca file
# ini saat membuat "Blueprint" baru dari dashboard.
#
# PENTING:
#   - Free tier memakai penyimpanan sementara. Data JSON dapat kembali ke
#     keadaan awal setelah restart/deploy. Jangan gunakan untuk data produksi.
#   - Sebutan "secret" TIDAK boleh di-hardcode di file ini. Nilai rahasia
#     (KCI_PEPPER, KCI_TOKEN_ADMIN) dideklarasikan dengan `sync: false` —
#     Render akan MEMINTA nilainya saat pertama kali membuat Blueprint.
#   - KCI_ASAL_DIIZINKAN juga `sync: false` karena bergantung pada domain
#     Vercel kamu. Isikan domain Vercel saat diminta Render.
#
# Untuk produksi, upgrade service ke Starter dan tambahkan Persistent Disk.
# Lihat panduan lengkap: PANDUAN-DEPLOY-VERCEL-RENDER.md

services:
  - type: web
    name: kci-api
    runtime: node
    # Free cukup untuk pengujian dan tidak memerlukan kartu kredit.
    # Penyimpanan bersifat ephemeral: data akan hilang saat restart/deploy.
    plan: free
    region: singapore
    healthCheckPath: /api/kesehatan
    # Build command dikosongkan — backend ini "no dependencies", cukup node.
    buildCommand: ""
    # Start server langsung dari server/src/index.js (Node, tanpa build).
    startCommand: node server/src/index.js
    # Auto-deploy saat commit ke branch produksi (mis. main).
    autoDeploy: true
    envVars:
      # --- Nilai non-rahasia, aman ditulis di sini ---
      - key: NODE_ENV
        value: production
      # Free tier tidak memiliki disk persisten. /tmp dapat ditulis, tetapi
      # seluruh data akan hilang ketika instance dimulai ulang.
      - key: KCI_DIR_DATA
        value: /tmp/kci-data
      - key: KCI_CHESS_KLUB
        value: blunder-skuad
      - key: KCI_CHESS_KLUB_CACHE
        value: "43200"
      # Render menaruh satu reverse proxy di depan aplikasi, jadi IP klien
      # dibaca dari X-Forwarded-For (untuk rate limit). Jangan ubah ke 0.
      - key: KCI_JUMLAH_PROXY
        value: "1"
      - key: KCI_LOG_PERMINTAAN
        value: "1"

      # --- Nilai yang HARUS diisi lewat dashboard (jangan hardcode) ---
      # Kata rahasia hashing identitas (min. 16 karakter).
      - key: KCI_PEPPER
        sync: false
      # Token endpoint pengurus (min. 24 karakter).
      - key: KCI_TOKEN_ADMIN
        sync: false
      # Origin frontend yang boleh memanggil API.
      #   https://<nama-proyek>.vercel.app  (dan domain kustom bila ada)
      - key: KCI_ASAL_DIIZINKAN
        sync: false

      # --- Opsional: verifikasi akun via OAuth Chess.com ---
      # Isi bila ingin mengaktifkan login OAuth penuh; kosong = jalur kode.
      # - key: KCI_CHESS_CLIENT_ID
      #   sync: false
      # - key: KCI_CHESS_CLIENT_SECRET
      #   sync: false
      # - key: KCI_CHESS_REDIRECT_URI
      #   sync: false
